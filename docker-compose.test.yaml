# Staging/test stack — runs beside production without replacing it.
# Usage: docker-compose -f docker-compose.test.yaml up -d --build
# Test URL: http://YOUR_SERVER_IP:8080

version: "3.9"

services:

  backend:
    build: ./backend
    container_name: test-django-backend
    restart: unless-stopped
    volumes:
      - ./backend:/backend
    expose:
      - "8000"
    depends_on:
      - db
      - tonservice
    env_file:
      - ./backend/.env
    environment:
      TON_SERVICE_URL: http://tonservice:3001
      POSTGRES_HOST: db
      POSTGRES_DB: mydb_test
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      DJANGO_DEBUG: "false"
    command: >
      sh -c "
      python manage.py migrate &&
      gunicorn core.wsgi:application --bind 0.0.0.0:8000
      "

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BOT_USERNAME: ${VITE_BOT_USERNAME:-Aipolynetbot}
        VITE_MINI_APP_SHORT_NAME: ${VITE_MINI_APP_SHORT_NAME:-app}
    container_name: test-react-frontend
    restart: unless-stopped

  tonservice:
    build: ./ton-service
    container_name: test-ton-service
    environment:
      TON_NETWORK: mainnet
      TREASURY_MNEMONIC: ${TREASURY_MNEMONIC}
    expose:
      - "3001"

  nginx:
    build:
      context: ./frontend
      args:
        VITE_BOT_USERNAME: ${VITE_BOT_USERNAME:-Aipolynetbot}
        VITE_MINI_APP_SHORT_NAME: ${VITE_MINI_APP_SHORT_NAME:-app}
    container_name: test-nginx-server
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

  db:
    image: postgres:16
    container_name: test-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydb_test
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - pg_data_test:/var/lib/postgresql/data

volumes:
  pg_data_test:
